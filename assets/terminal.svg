<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">iFaNGMiNGi's pixel cat coding desk</title>
  <desc id="desc">A playful animated macOS window with a pixel ninja cat building tiny macOS magic.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff1f8"/><stop offset=".5" stop-color="#e9fbf7"/><stop offset="1" stop-color="#e8f1ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#6366a0" flood-opacity=".18"/>
    </filter>
    <clipPath id="screen"><rect x="105" y="112" width="530" height="238" rx="8"/></clipPath>
  </defs>

  <rect width="1000" height="430" rx="24" fill="url(#sky)"/>
  <g fill="#fff" opacity=".65">
    <circle cx="82" cy="76" r="4"><animate attributeName="cy" values="76;68;76" dur="3s" repeatCount="indefinite"/></circle>
    <path d="M900 65l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#f9a8d4"><animateTransform attributeName="transform" type="rotate" from="0 900 78" to="360 900 78" dur="8s" repeatCount="indefinite"/></path>
    <path d="M745 370l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#60d7bd"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></path>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="48" width="860" height="330" rx="18" fill="#fffdfb" stroke="#6d6488" stroke-width="3"/>
    <path d="M70 66a18 18 0 0118-18h824a18 18 0 0118 18v36H70z" fill="#f7cce2"/>
    <circle cx="99" cy="75" r="7" fill="#ff6b7a"/><circle cx="123" cy="75" r="7" fill="#ffc85a"/><circle cx="147" cy="75" r="7" fill="#5dd8a7"/>
    <text x="500" y="82" text-anchor="middle" fill="#665b7b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">✨ tiny-mac-magic.swift</text>
  </g>

  <rect x="92" y="106" width="555" height="256" rx="12" fill="#242338" stroke="#6d6488" stroke-width="3"/>
  <g clip-path="url(#screen)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="119" y="143" fill="#ff9ecb" font-size="18">let</text><text x="157" y="143" fill="#f8f4ff" font-size="18">fang = Developer(</text>
    <text x="139" y="176" fill="#b5a9d6" font-size="17">platform:</text><text x="247" y="176" fill="#8ee6cf" font-size="17">"macOS"</text><text x="318" y="176" fill="#f8f4ff" font-size="17">,</text>
    <text x="139" y="207" fill="#b5a9d6" font-size="17">superpower:</text><text x="267" y="207" fill="#ffd47e" font-size="17">"polish"</text>
    <text x="119" y="238" fill="#f8f4ff" font-size="18">)</text>
    <text x="119" y="283" fill="#ff9ecb" font-size="18">while</text><text x="178" y="283" fill="#f8f4ff" font-size="18">idea.isUseful {</text>
    <text x="139" y="316" fill="#72c7ff" font-size="18">ship</text><text x="183" y="316" fill="#f8f4ff" font-size="18">(small: </text><text x="264" y="316" fill="#8ee6cf" font-size="18">true</text><text x="302" y="316" fill="#f8f4ff" font-size="18">)</text>
    <rect x="323" y="299" width="9" height="21" rx="2" fill="#ff9ecb"><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></rect>
  </g>

  <!-- speech bubble -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M672 118h208a13 13 0 0113 13v62a13 13 0 01-13 13H762l-25 22 5-22h-70a13 13 0 01-13-13v-62a13 13 0 0113-13z" fill="#fff" stroke="#6d6488" stroke-width="3"/>
    <text x="776" y="153" text-anchor="middle" fill="#665b7b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">building tiny</text>
    <text x="776" y="179" text-anchor="middle" fill="#ec659f" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">macOS magic ✨</text>
  </g>

  <!-- pixel ninja cat -->
  <g shape-rendering="crispEdges">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="1.4s" repeatCount="indefinite"/>
    <path d="M710 245v-18h18v9h54v-9h18v18h9v72h-9v18h-18v9h-54v-9h-18v-18h-9v-72z" fill="#4d4966"/>
    <path d="M719 254h81v45h-81z" fill="#68627f"/>
    <path d="M719 263h81v27h-81z" fill="#29283c"/>
    <rect x="734" y="272" width="12" height="6" fill="#8ee6cf"><animate attributeName="height" values="6;6;1;6;6" keyTimes="0;.42;.5;.58;1" dur="3.2s" repeatCount="indefinite"/></rect>
    <rect x="773" y="272" width="12" height="6" fill="#8ee6cf"><animate attributeName="height" values="6;6;1;6;6" keyTimes="0;.42;.5;.58;1" dur="3.2s" repeatCount="indefinite"/></rect>
    <rect x="755" y="284" width="9" height="6" fill="#f6a9c9"/>
    <path d="M746 302h27v6h-27z" fill="#f7cce2"/>
    <rect x="716" y="317" width="87" height="18" fill="#77708f"/>
    <rect x="725" y="323" width="69" height="6" fill="#f7cce2"/>
    <rect x="704" y="312" width="18" height="9" fill="#4d4966"><animateTransform attributeName="transform" type="translate" values="0 0;10 6;0 0" dur=".55s" repeatCount="indefinite"/></rect>
    <rect x="797" y="312" width="18" height="9" fill="#4d4966"><animateTransform attributeName="transform" type="translate" values="0 6;-10 0;0 6" dur=".55s" repeatCount="indefinite"/></rect>
    <path d="M803 300h18v9h9v18h-9v-9h-18z" fill="#4d4966"><animateTransform attributeName="transform" type="rotate" values="-8 803 300;12 803 300;-8 803 300" dur="1.2s" repeatCount="indefinite"/></path>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">
    <g><rect x="673" y="348" width="70" height="25" rx="12" fill="#ffd8e9"/><text x="708" y="365" text-anchor="middle" fill="#a64270">Swift</text></g>
    <g><rect x="750" y="348" width="75" height="25" rx="12" fill="#cdf5e9"/><text x="787" y="365" text-anchor="middle" fill="#237f69">AppKit</text></g>
    <g><rect x="832" y="348" width="72" height="25" rx="12" fill="#d8eaff"/><text x="868" y="365" text-anchor="middle" fill="#3974a8">Ship!</text></g>
  </g>
</svg>
